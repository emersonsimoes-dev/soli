name: soli

services:
  app:
    build:
      context: ./docker/php
    container_name: soli-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soli

  nginx:
    image: nginx:1.27-alpine
    container_name: soli-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - soli

  postgres:
    image: postgres:17
    container_name: soli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-soli}
      POSTGRES_USER: ${DB_USERNAME:-soli}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/init-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-soli} -d ${DB_DATABASE:-soli}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - soli

  redis:
    image: redis:7-alpine
    container_name: soli-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - soli

  mailpit:
    image: axllent/mailpit:latest
    container_name: soli-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - soli

  queue:
    build:
      context: ./docker/php
    container_name: soli-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - soli

  scheduler:
    build:
      context: ./docker/php
    container_name: soli-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - soli

volumes:
  postgres_data:
    name: soli_postgres
  redis_data:
    name: soli_redis

networks:
  soli:
    driver: bridge
