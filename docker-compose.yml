services:
  app:
    build:
      context: ./docker/php
    container_name: icvb-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icvb

  nginx:
    image: nginx:1.27-alpine
    container_name: icvb-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - icvb

  postgres:
    image: postgres:17
    container_name: icvb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-icvb}
      POSTGRES_USER: ${DB_USERNAME:-icvb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/init-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-icvb} -d ${DB_DATABASE:-icvb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - icvb

  redis:
    image: redis:7-alpine
    container_name: icvb-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - icvb

  mailpit:
    image: axllent/mailpit:latest
    container_name: icvb-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - icvb

  queue:
    build:
      context: ./docker/php
    container_name: icvb-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - icvb

  scheduler:
    build:
      context: ./docker/php
    container_name: icvb-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - icvb

volumes:
  postgres_data:
  redis_data:

networks:
  icvb:
    driver: bridge
